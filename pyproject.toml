[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Standalone entry points add the repository root before importing local modules.
"experiments/*.py" = ["E402"]
"scripts/*.py" = ["E402"]
"reports/*.py" = ["E402"]
"tests/run_offline_suite.py" = ["E402"]
"routing_ml/reporting*.py" = ["E402"]
"provider_clients/*.py" = ["I001"]
# These exact source bytes are pinned by the historical pilot provenance.
"benchmark_loaders.py" = ["I001"]
"generate_dataset.py" = ["I001"]
"graders.py" = ["I001"]
"model_registry.py" = ["I001"]
"providers.py" = ["I001"]

[tool.ruff.format]
# Preserve historical source hashes; all files still receive correctness lint.
exclude = [
    "provider_clients/*.py",
    "benchmark_loaders.py",
    "generate_dataset.py",
    "graders.py",
    "model_registry.py",
    "providers.py",
]
